name: Build and Publish Docker Image

on:
  push:
    branches: [master]
  schedule:
    # Every Monday 06:00 UTC - keeps yt-dlp (and other deps) from going
    # stale even when nothing in this repo has changed.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short

      # Build once without pushing so the smoke test below can veto a
      # broken image (spotdl's yt-dlp API usage can lag the always-latest
      # yt-dlp this Dockerfile now installs) before anything reaches
      # `latest`. The real push right after reuses this build's cache,
      # so it costs little extra time.
      - name: Build image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: playlistdl:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --rm playlistdl:smoke-test \
            python3 -c "import spotdl, yt_dlp; print('spotdl', spotdl.__version__); print('yt-dlp', yt_dlp.version.__version__)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
